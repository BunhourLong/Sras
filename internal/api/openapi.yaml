openapi: 3.0.3
info:
  title: Sras
  description: HTTP document database on a Bitcask-style storage engine.
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /db/{collection}/{id}:
    parameters:
      - name: collection
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9_-]{1,64}$", example: users }
      - name: id
        in: path
        required: true
        description: Non-empty, max 256 bytes, no "/" or NUL.
        schema: { type: string, example: alice }
    get:
      summary: Read a document
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      summary: Create or replace a document
      description: >
        Omit `_rev` to create. To replace, send the current `_rev`;
        a stale one returns 409. `_id` and `_updatedAt` are set by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
            example: { name: Alice, age: 30 }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a document
      description: >
        Optional revision precondition via `?rev=N` or `If-Match: "N"`
        (the query parameter wins); a stale one returns 409.
      parameters:
        - name: rev
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: If-Match
          in: header
          required: false
          schema: { type: string, example: '"3"' }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /db/{collection}:
    parameters:
      - name: collection
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9_-]{1,64}$", example: users }
    post:
      summary: Create a document with a server-generated id
      description: >
        The id is a server-generated UUIDv7 (time-ordered); any `_id` in the
        body is ignored. The body must be a JSON object. `_rev` rules as when
        creating with PUT: omit it or send 0; anything else returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
            example: { name: Alice, age: 30 }
      responses:
        "201":
          description: Created; the Location header points at the new document
          headers:
            Location:
              description: /db/{collection}/{id} of the created document
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
components:
  schemas:
    Document:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string, readOnly: true }
        _rev: { type: integer, minimum: 0 }
        _updatedAt: { type: string, format: date-time, readOnly: true }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, enum: [bad_request, not_found, conflict, internal] }
                  message: { type: string }
